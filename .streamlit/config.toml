[theme]
base = "dark"
primaryColor = "#0F766E"
backgroundColor = "#071521"
secondaryBackgroundColor = "#102536"
codeBackgroundColor = "#102536"
textColor = "#F4F7F9"
linkColor = "#5EEAD4"
borderColor = "#274257"
codeTextColor = "#D7E3EA"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["34px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 650, 600, 600, 500, 500]
linkUnderline = false

greenColor = "#2DD4BF"
redColor = "#FB7185"
yellowColor = "#F4C04C"
orangeColor = "#F59E0B"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

chartCategoricalColors = [
    "#F4C04C",
    "#2DD4BF",
    "#60A5FA",
    "#A78BFA",
    "#FB923C",
    "#FB7185",
    "#94A3B8",
]

chartSequentialColors = [
    "#173047",
    "#1D4960",
    "#236479",
    "#2B8190",
    "#3A9F9F",
    "#5DBDAA",
    "#8BD5B7",
    "#BCE8C5",
    "#E3F2CF",
    "#FFF4C2",
]

dataframeBorderColor = "#274257"
dataframeHeaderBackgroundColor = "#173047"

[theme.sidebar]
backgroundColor = "#08121C"
secondaryBackgroundColor = "#102536"
codeBackgroundColor = "#102536"
textColor = "#F4F7F9"
borderColor = "#274257"
primaryColor = "#0F766E"

[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true

[client]
showErrorDetails = false
toolbarMode = "viewer"

[logger]
level = "info"
